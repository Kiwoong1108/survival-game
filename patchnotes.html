<title>서바이벌 패치노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: 왼쪽에 버전 목차(좁은 화면에서는 가로 칩), 오른쪽에 최신순 패치 기록. 게임과 같은 숲 바닥 다크 룩 한 가지. */
:root{
  --bg:#0f1613;
  --panel:#16211c;
  --line:#2f4239;
  --fg:#ecf1ea;
  --dim:#9fb2a6;
  --gold:#f2c14e;
  --add:#6fe3a1;
  --chg:#f2c14e;
  --del:#ff8a9b;
  --fix:#7fd0ff;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --pixel:'Press Start 2P',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 var(--body);
  padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.page{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font:400 38px/1.1 var(--display);margin:0;letter-spacing:.03em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--dim);font-size:14px}
.cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cur .lbl{color:var(--dim);font-size:13px}
.badge{font:400 12px/1 var(--pixel);color:#201807;background:var(--gold);padding:8px 10px;border-radius:3px}
.play{font:400 18px/1 var(--display);color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:9px 18px;border-radius:4px;letter-spacing:.05em}
.play:hover,.play:focus-visible{background:var(--gold);color:#201807;outline:none}
.layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:36px;align-items:start}
nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
nav .t{font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
nav a{
  font:400 11px/1 var(--pixel);color:var(--dim);text-decoration:none;
  padding:11px 10px;border-left:2px solid var(--line);
}
nav a:hover,nav a:focus-visible,nav a[aria-current="true"]{color:var(--gold);border-left-color:var(--gold);outline:none}
main{display:flex;flex-direction:column;min-width:0}
.entry{
  display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 28px;
  padding-block:26px;border-top:1px solid var(--line);scroll-margin-top:16px;
}
.entry:first-child{border-top:0;padding-top:0}
.meta{display:flex;flex-direction:column;gap:6px}
.ver{font:400 15px/1.2 var(--pixel);color:var(--fg)}
.entry.latest .ver{color:var(--gold)}
.new{font:400 10px/1 var(--pixel);color:#201807;background:var(--gold);padding:6px 7px;border-radius:2px;align-self:flex-start}
.body{min-width:0;display:flex;flex-direction:column;gap:16px}
h2{font:400 26px/1.2 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.group{display:flex;flex-direction:column;gap:6px}
.tag{
  align-self:flex-start;font:700 12px/1 var(--body);letter-spacing:.06em;padding:5px 9px;border-radius:3px;
  border:1px solid currentColor;
}
.tag.add{color:var(--add)}.tag.chg{color:var(--chg)}.tag.del{color:var(--del)}.tag.fix{color:var(--fix)}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
li{max-width:68ch;text-wrap:pretty}
li::marker{color:var(--dim)}
ul.sub{margin-top:4px;gap:2px;padding-left:16px;list-style:'- ';color:var(--dim);font-size:14px}
footer{color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:760px){
  h1{font-size:30px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  nav .t{display:none}
  nav a{border-left:0;border:1px solid var(--line);border-radius:3px;padding:9px 10px}
  nav a:hover,nav a:focus-visible,nav a[aria-current="true"]{border-color:var(--gold)}
  .entry{grid-template-columns:minmax(0,1fr)}
  .meta{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 12px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<div class="page">
  <header>
    <div>
      <h1>서바이벌 패치노트</h1>
      <p class="sub">버전별 변경 내용을 최신순으로 정리했습니다.</p>
    </div>
    <div class="cur">
      <span class="lbl">현재 버전</span>
      <span class="badge" id="cur-ver">v0.5.0</span>
      <a class="play" href="https://claude.ai/artifact/UQ7sDUVjmkDcaWQdtVhurS" target="_blank" rel="noopener">게임 열기</a>
    </div>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="버전 목차"><span class="t">버전</span></nav>
    <main id="list"></main>
  </div>

  <footer>새 버전이 올라가면 이 페이지에 항목이 추가됩니다.</footer>
</div>

<script>
/* 패치 기록. 새 버전은 배열 맨 앞에 추가합니다. kind: add 추가 / chg 변경 / del 제거 / fix 수정.
   항목은 문자열이거나 {t:'제목', sub:['세부', ...]} 입니다. */
const PATCHES=[
  {v:'0.5.0',title:'업적과 경험치 개편',
   groups:[
    {kind:'add',items:[
      {t:'이제 로비 오른쪽(3시 방향)의 업적존에서 업적 기록을 열람할 수 있습니다. 열람만 가능하고, 보상은 처음 달성할 때 한 번만 받습니다.',sub:['기록은 판이 끝나도 누적되고 브라우저에 저장됩니다']},
      {t:'이제 공격력 업적으로 몬스터를 누적 100, 500, 1,000, 5,000, 10,000마리 처치할 때마다 공격력 +5를 받습니다.',sub:['최대 +25']},
      {t:'이제 체력 업적으로 받은 피해가 누적 50, 200, 500, 1,000, 2,000에 도달할 때마다 최대 체력 +15를 받습니다.',sub:['최대 +75']},
      '이제 인게임 오른쪽 위에 업적 창이 항상 켜져 있고, 스탯마다 다음 업적 2개의 진행도를 보여줍니다. 창을 클릭하면 접거나 펼칠 수 있습니다.',
      '이제 업적을 달성하면 화면 위쪽에 알림이 나옵니다. 훈련장에서는 업적이 쌓이지 않습니다.'
    ]},
    {kind:'chg',items:[
      {t:'이제 경험치 바가 두꺼워지고 현재 경험치와 필요 경험치가 숫자로 보입니다. 경험치 조각도 더 크고 밝게 빛납니다.'},
      {t:'이제 몬스터를 처치하면 경험치를 바로 흡수합니다. 처치 지점에서 날아오는 조각은 연출입니다.'},
      {t:'이제 모든 캐릭터의 경험치 획득량이 1.5배가 됩니다.'},

      {t:'이제 루테란의 주변 공격이 7, 5, 3초마다 발동하고, 2, 3, 4바퀴 돕니다. 회전 속도는 0.85배로 느려졌습니다.',sub:['기존: 7, 6, 5초마다 1바퀴']},
      {t:'이제 니나브의 「천벌, 파르쿠니스」에 단계별 최소 피해가 생깁니다.',sub:['1단계 30, 2단계 45, 3단계 60','최대 체력 비례 피해가 이보다 낮으면 최소 피해가 적용됩니다']},
      {t:'이제 필살기로 처치한 몬스터는 필살기 게이지의 처치 100마리 집계에 포함되지 않습니다.'},

      {t:'이제 레벨업 선택지의 이동속도 증가량이 절반이 됩니다.',sub:['레벨당 +1.5%에서 +0.75%로 줄었습니다','기본 이동속도는 그대로입니다']},

  {v:'0.4.0',title:'레벨업 선택지와 특수 능력',

      {t:'이제 레벨업할 때마다 일반 선택지 3개 중 하나를 고릅니다. 특수 능력이 나오는 10, 20, 25레벨은 제외입니다.',sub:['공격력, 공격속도, 이동속도, 체력, 방어력 중에서 나오고, 각각 최대 5단계입니다.','5단계까지 찍어야 겨우 체감될 정도로 효과가 작습니다.','공격력 +2%, 공격속도 +2%, 이동속도 +1.5%, 체력 +4, 방어력 +0.5가 단계마다 쌓입니다.']},
      '이제 일반 선택지와 보물상자 선택지는 은색 배경으로 나오고, 아래의 동그라미 5개가 한 칸씩 채워집니다.',
      '이제 특수 능력 선택지는 금색 배경으로 나오고, 아래의 별 3개가 한 칸씩 채워집니다.'
    ]},
    {kind:'add',items:[
      {t:'이제 루테란이 10, 20, 25레벨에 특수 능력을 선택합니다. 한 번 고른 능력은 고정되고, 이후 20, 25레벨에 한 단계씩 강해집니다. 최대 3단계입니다.',sub:['2회 공격: 공격 6회, 5회, 4회마다 1번, 공격이 시전된 방향으로 한 번 더 공격합니다. 추가 공격은 80% 피해를 줍니다.','칼 사거리 증가: 칼 사거리가 한 단계마다 15%씩 늘어납니다.','주변 공격 (360도): 7초, 6초, 5초마다 주변 360도를 한 바퀴 돌며 벱니다.']},
      {t:'이제 루테란이 25레벨에서 특수 능력을 고른 뒤, 무지개색으로 빛나는 선택지로 필살기 「루테란의 긍지」를 얻습니다.',sub:['몬스터를 100마리 처치할 때마다 스페이스바로 사용합니다.','화면 하단 게이지가 처치할 때마다 차고, 가득 차면 하늘색으로 은은하게 빛납니다.','사용하면 화면이 서서히 하얗게 밝아졌다가, 몬스터가 가장 많은 방향으로 화면 끝까지 검을 내리찍습니다. 가로 범위는 몬스터 4마리 정도이고, 바닥이 불규칙하게 부서집니다.']}

    {kind:'add',items:[
      {t:'이제 니나브가 10, 20, 25레벨에 특수 능력을 선택합니다. 루테란과 같이 한 번 고른 능력은 고정되고 최대 3단계입니다.',sub:['다중 공격: 화살이 부채꼴로 2발, 3발, 4발 나가고, 발당 피해가 75%로 줄어듭니다.','떠다니는 화살: 공격할 때마다 몸 주변에 화살이 1발, 2발, 3발씩 쌓이고, 6발이 쌓이면 잠시 떠 있다가 주변 몬스터 6마리에게 무작위로 차례차례 날아갑니다. 떠다니는 동안은 피해를 주지 않고, 날아가는 동안에는 화살이 더 쌓이지 않습니다.','관통 화살: 화살이 더 굵어지고 판정이 15% 커지며, 단계마다 관통하는 몬스터가 1마리씩 늘어납니다.']},
      {t:'이제 니나브가 25레벨에서 특수 능력을 고른 뒤, 무지개색으로 빛나는 선택지로 필살기 「천벌, 파르쿠니스」을 얻습니다.',sub:['몬스터를 100마리 처치할 때마다 사용할 수 있고, 스페이스바를 누르고 있으면 차징하고 떼면 발사합니다.','차징은 1, 2, 3단계가 있고 단계마다 0.75초씩 걸립니다. 차징 중에는 몸 주변으로 게이지가 빨려들고, 서서히 커지는 잔잔한 화면 흔들림이 생깁니다.','3단계가 된 뒤에도 2초 이상 차징하면 자동으로 발사됩니다.','화면에서 몬스터가 가장 많은 방향으로 번개 화살이 직선으로 화면 끝까지 뻗어나가며 지나가는 몬스터를 모두 맞힙니다. 니나브 몸이 뒤로 살짝 밀려나고, 발사할 때 화면이 흔들리며, 바닥에 번개 자국이 잠시 남습니다.','번개 화살은 단계마다 굵어지고, 맞은 몬스터의 최대 체력의 50%, 75%, 90% 피해를 줍니다.','처음 맞은 몬스터 주변 2명, 3명, 4명에게 번개가 전이되고, 번개에 맞은 몬스터는 1초간 감전되어 움직이지 못합니다.']}

  {v:'0.3.2',title:'캐릭터 그래픽 개편',
   groups:[

const KIND={add:'추가',chg:'변경',del:'제거',fix:'수정'};
const list=document.getElementById('list'),nav=document.getElementById('nav');
const id=v=>'v'+v.replace(/\./g,'-');
document.getElementById('cur-ver').textContent='v'+PATCHES[0].v;

PATCHES.forEach((p,i)=>{
  const a=document.createElement('a');
  a.href='#'+id(p.v);a.textContent='v'+p.v;
  nav.appendChild(a);

  const e=document.createElement('article');
  e.className='entry'+(i===0?' latest':'');e.id=id(p.v);
  const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML='<span class="ver"></span>'+(i===0?'<span class="new">최신</span>':'');
  meta.querySelector('.ver').textContent='v'+p.v;
  const body=document.createElement('div');body.className='body';
  const h=document.createElement('h2');h.textContent=p.title;body.appendChild(h);
  p.groups.forEach(g=>{
    const box=document.createElement('div');box.className='group';
    const tag=document.createElement('span');tag.className='tag '+g.kind;tag.textContent=KIND[g.kind];
    const ul=document.createElement('ul');
    g.items.forEach(it=>{
      const li=document.createElement('li');
      if(typeof it==='string'){li.textContent=it}
      else{
        li.textContent=it.t;
        const sub=document.createElement('ul');sub.className='sub';
        it.sub.forEach(x=>{const l2=document.createElement('li');l2.textContent=x;sub.appendChild(l2)});
        li.appendChild(sub);
      }
      ul.appendChild(li);
    });
    box.append(tag,ul);body.appendChild(box);
  });
  e.append(meta,body);list.appendChild(e);
});

/* 스크롤 위치에 맞춰 목차 강조 */
const links=[...nav.querySelectorAll('a')];
function mark(){
  let cur=0;
  PATCHES.forEach((p,i)=>{
    const el=document.getElementById(id(p.v));
    if(el.getBoundingClientRect().top<window.innerHeight*0.35)cur=i;
  });
  links.forEach((l,i)=>l.setAttribute('aria-current',i===cur?'true':'false'));
}
window.addEventListener('scroll',mark,{passive:true});mark();
try{
  const h=location.hash.slice(1);
  if(h){const el=document.getElementById(h);if(el)el.scrollIntoView()}
}catch(e){}
</script>
